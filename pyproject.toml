[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-alignment"
version = "0.1.0"
description = "Traceable project alignment before implementation planning."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
alignment = "epistemic_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
